
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuizCore | Admin Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #060816;
            --card: rgba(15, 20, 40, 0.78);
            --border: rgba(255, 255, 255, 0.10);
            --text: #f5f7ff;
            --muted: #8d96ad;
            --primary: #7c5cff;
            --primary-light: #9b83ff;
            --danger: #ff5f73;
        }

        body {
            min-height: 100vh;
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            color: var(--text);

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(124, 92, 255, 0.20),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(0, 200, 255, 0.12),
                    transparent 30%
                ),
                var(--bg);
        }

        /* =========================
           ANIMATED BACKGROUND
        ========================= */

        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(1px);
            opacity: 0.35;
            animation: float 10s ease-in-out infinite;
        }

        .orb.one {
            width: 320px;
            height: 320px;

            background: rgba(124, 92, 255, 0.15);

            top: -100px;
            left: -80px;
        }

        .orb.two {
            width: 260px;
            height: 260px;

            background: rgba(0, 190, 255, 0.10);

            right: -70px;
            bottom: -80px;

            animation-delay: -4s;
        }

        .orb.three {
            width: 150px;
            height: 150px;

            background: rgba(180, 80, 255, 0.08);

            top: 40%;
            right: 15%;

            animation-delay: -7s;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(25px, -30px);
            }
        }

        /* =========================
           LOGIN WRAPPER
        ========================= */

        .page {
            width: 100%;
            padding: 24px;

            display: flex;
            justify-content: center;
            align-items: center;

            position: relative;
            z-index: 2;
        }

        .login-card {
            width: 100%;
            max-width: 440px;

            padding: 42px;

            background: var(--card);

            border: 1px solid var(--border);

            border-radius: 28px;

            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);

            box-shadow:
                0 30px 100px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);

            animation: cardAppear 0.7s ease;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* =========================
           BRAND
        ========================= */

        .brand {
            text-align: center;
            margin-bottom: 34px;
        }

        .logo {
            width: 58px;
            height: 58px;

            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 18px;

            font-size: 25px;
            font-weight: 900;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #7c5cff,
                    #a78bfa
                );

            box-shadow:
                0 15px 35px rgba(124, 92, 255, 0.30);
        }

        .brand h1 {
            font-size: 30px;
            font-weight: 850;

            letter-spacing: -1px;
        }

        .brand h1 span {
            color: var(--primary-light);
        }

        .brand p {
            margin-top: 8px;

            color: var(--muted);

            font-size: 14px;
        }

        /* =========================
           FORM
        ========================= */

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 9px;

            color: #d9deeb;

            font-size: 13px;
            font-weight: 700;
        }

        .input-wrapper {
            position: relative;
        }

        input {
            width: 100%;

            height: 52px;

            padding: 0 16px;

            border-radius: 13px;

            border: 1px solid rgba(255, 255, 255, 0.09);

            outline: none;

            background:
                rgba(5, 8, 20, 0.75);

            color: white;

            font-size: 14px;

            transition:
                border-color 0.2s,
                box-shadow 0.2s,
                background 0.2s;
        }

        input::placeholder {
            color: #5f687d;
        }

        input:focus {
            border-color: var(--primary);

            background:
                rgba(8, 11, 25, 0.95);

            box-shadow:
                0 0 0 4px rgba(124, 92, 255, 0.11);
        }

        /* =========================
           PASSWORD TOGGLE
        ========================= */

        .password-input {
            padding-right: 52px;
        }

        .toggle-password {
            position: absolute;

            right: 12px;
            top: 50%;

            transform: translateY(-50%);

            width: 34px;
            height: 34px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: none;
            background: transparent;

            color: #78839b;

            cursor: pointer;

            border-radius: 8px;

            transition: 0.2s;
        }

        .toggle-password:hover {
            color: white;
            background: rgba(255, 255, 255, 0.06);
        }

        /* =========================
           LOGIN BUTTON
        ========================= */

        .login-button {
            width: 100%;

            height: 54px;

            margin-top: 8px;

            border: none;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    #7c5cff,
                    #6846e8
                );

            color: white;

            font-size: 14px;
            font-weight: 800;

            cursor: pointer;

            position: relative;

            overflow: hidden;

            transition:
                transform 0.2s,
                box-shadow 0.2s;
        }

        .login-button::before {
            content: "";

            position: absolute;

            top: 0;
            left: -100%;

            width: 100%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.15),
                    transparent
                );

            transition: left 0.5s;
        }

        .login-button:hover::before {
            left: 100%;
        }

        .login-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 15px 35px rgba(124, 92, 255, 0.30);
        }

        .login-button:active {
            transform: translateY(0);
        }

        /* =========================
           LOADING
        ========================= */

        .button-content {
            display: flex;

            align-items: center;
            justify-content: center;

            gap: 9px;
        }

        .spinner {
            width: 17px;
            height: 17px;

            border-radius: 50%;

            border:
                2px solid rgba(255,255,255,0.35);

            border-top-color: white;

            animation:
                spin 0.7s linear infinite;

            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .login-button.loading .spinner {
            display: block;
        }

        .login-button.loading .button-text {
            opacity: 0.8;
        }

        /* =========================
           FOOTER
        ========================= */

        .security-note {
            margin-top: 24px;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 7px;

            color: #68738a;

            font-size: 11px;
        }

        .lock-icon {
            width: 14px;
            height: 14px;

            border: 1.5px solid #68738a;

            border-radius: 3px;

            position: relative;
        }

        .lock-icon::before {
            content: "";

            position: absolute;

            width: 6px;
            height: 6px;

            border:
                1.5px solid #68738a;

            border-bottom: none;

            border-radius: 5px 5px 0 0;

            left: 2.5px;
            top: -6px;
        }

        /* =========================
           FLASH MESSAGE
        ========================= */

        .flash {
            margin-top: 18px;

            padding: 12px 14px;

            border-radius: 10px;

            font-size: 13px;

            text-align: center;
        }

        .flash.error {
            color: #ff9aaa;

            background:
                rgba(255, 95, 115, 0.08);

            border:
                1px solid rgba(255, 95, 115, 0.14);
        }

        .flash.success {
            color: #79e7c4;

            background:
                rgba(36, 214, 165, 0.08);

            border:
                1px solid rgba(36, 214, 165, 0.14);
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 520px) {

            .page {
                padding: 16px;
            }

            .login-card {
                padding: 32px 24px;

                border-radius: 22px;
            }

            .brand h1 {
                font-size: 26px;
            }

            .logo {
                width: 52px;
                height: 52px;

                border-radius: 16px;
            }
        }
    </style>
</head>

<body>

    <!-- Animated background -->
    <div class="background">

        <div class="orb one"></div>
        <div class="orb two"></div>
        <div class="orb three"></div>

    </div>


    <main class="page">

        <section class="login-card">

            <!-- Brand -->
            <div class="brand">

                <div class="logo">
                    LH
                </div>

                <h1>
                    Logic<span>Hunt</span>
                </h1>

                <p>
                    Admin Control Center
                </p>

            </div>


            <!-- Login form -->
            <form
                method="POST"
                action="{{ url_for('admin_login') }}"
                id="loginForm"
            >

                <!-- Username -->
                <div class="form-group">

                    <label for="username">
                        Admin Username
                    </label>

                    <input
                        id="username"
                        type="text"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <input
                            id="password"
                            class="password-input"
                            type="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            id="togglePassword"
                            aria-label="Show password"
                        >
                            <svg
                                id="eyeIcon"
                                width="18"
                                height="18"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <path
                                    d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"
                                />

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="3"
                                />
                            </svg>
                        </button>

                    </div>

                </div>


                <!-- Login -->
                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >

                    <span class="button-content">

                        <span
                            class="spinner"
                            id="spinner"
                        ></span>

                        <span class="button-text">
                            Enter Admin Portal
                        </span>

                    </span>

                </button>

            </form>


            <!-- Flask flash messages -->
            {% with messages = get_flashed_messages(
                with_categories=true
            ) %}

                {% for category, message in messages %}

                    <div class="flash {{ category }}">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endwith %}


            <!-- Security note -->
            <div class="security-note">

                <span class="lock-icon"></span>

                <span>
                    Secure administrator access
                </span>

            </div>

        </section>

    </main>


    <script>

        // ==========================================
        // PASSWORD VISIBILITY
        // ==========================================

        const passwordInput =
            document.getElementById("password");

        const togglePassword =
            document.getElementById("togglePassword");

        const eyeIcon =
            document.getElementById("eyeIcon");


        togglePassword.addEventListener(
            "click",
            function () {

                const isPassword =
                    passwordInput.type === "password";

                passwordInput.type =
                    isPassword
                        ? "text"
                        : "password";


                togglePassword.setAttribute(
                    "aria-label",
                    isPassword
                        ? "Hide password"
                        : "Show password"
                );


                if (isPassword) {

                    eyeIcon.innerHTML = `
                        <path
                            d="M3 3l18 18"
                        />

                        <path
                            d="M10.6 10.6
                               a2 2 0 0 0
                               2.8 2.8"
                        />

                        <path
                            d="M9.9 5.2
                               A10.9 10.9 0 0 1
                               12 5
                               c6.5 0
                               10 7
                               10 7
                               a18.3 18.3 0 0 1
                               -3.2 4.2"
                        />

                        <path
                            d="M6.6 6.6
                               C3.5 8.6
                               2 12
                               2 12
                               s3.5 7
                               10 7
                               c1.5 0
                               2.8-.3
                               4-.8"
                        />
                    `;

                } else {

                    eyeIcon.innerHTML = `
                        <path
                            d="M2 12s3.5-7 10-7
                               10 7 10 7
                               -3.5 7-10 7
                               S2 12 2 12Z"
                        />

                        <circle
                            cx="12"
                            cy="12"
                            r="3"
                        />
                    `;
                }

            }
        );


        // ==========================================
        // LOGIN LOADING STATE
        // ==========================================

        const loginForm =
            document.getElementById("loginForm");

        const loginButton =
            document.getElementById("loginButton");


        loginForm.addEventListener(
            "submit",
            function () {

                loginButton.classList.add(
                    "loading"
                );

                loginButton.disabled = true;

            }
        );


        // ==========================================
        // SMALL PARALLAX EFFECT
        // ==========================================

        const card =
            document.querySelector(".login-card");


        document.addEventListener(
            "mousemove",
            function (event) {

                const x =
                    (event.clientX / window.innerWidth - 0.5);

                const y =
                    (event.clientY / window.innerHeight - 0.5);


                card.style.transform =
                    `
                    translate(
                        ${x * 5}px,
                        ${y * 5}px
                    )
                    `;
            }
        );


        document.addEventListener(
            "mouseleave",
            function () {

                card.style.transform =
                    "translate(0, 0)";

            }
        );

    </script>

</body>
</html>
